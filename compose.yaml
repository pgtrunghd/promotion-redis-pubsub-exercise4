services:
  postgres:
    image: postgres:16-alpine
    ports: ["127.0.0.1:5446:5432"]
    environment:
      POSTGRES_DB: promotions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: ["promotion-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d promotions"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6386:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  promotion-db:
